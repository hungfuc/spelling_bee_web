version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: spelling_bee_mysql_prod
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: spelling_bee
    ports:
      - "3366:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spelling_bee_backend_prod
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: spelling_bee
      PORT: 3001
    expose:
      - "3001"
    volumes:
      - ./backend/data:/app/data:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend-build:
    image: node:18-alpine
    container_name: spelling_bee_frontend_build_prod
    working_dir: /app
    command: sh -c "npm install && npm run build"
    environment:
      PUBLIC_API_URL: ""
    volumes:
      - ./frontend:/app
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    container_name: spelling_bee_nginx_prod
    ports:
      - "80:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: spelling_bee_phpmyadmin_prod
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: password
    ports:
      - "8091:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data_prod:
